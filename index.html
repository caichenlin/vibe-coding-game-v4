// =====================================================
// 粒子（煙塵、火花、碎石）
// =====================================================
// opt：color 顏色、speed 速度、life 存活秒數、size 大小、up 往上飄的速度、gravity 重力
function emit(x, y, n, opt) {
  if (!G) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = opt.speed * (0.4 + Math.random() * 0.6);
    G.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp * 0.6 - (opt.up || 0),
      life: opt.life * (0.6 + Math.random() * 0.4),
      max: opt.life,
      size: opt.size * (0.6 + Math.random() * 0.6),
      color: opt.color,
      gravity: opt.gravity || 0,
    });
  }
}

// 塔倒塌時飛出去的石塊碎片（會旋轉、往上拋再落下，落地後停住慢慢消失）
function emitChunk(x, y, color) {
  if (!G) return;
  const a = -Math.PI / 2 + randRange(-1.3, 1.3);
  const sp = randRange(80, 190);
  G.particles.push({
    x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
    life: randRange(1.1, 1.6), max: 1.6,
    size: randRange(3, 6.5), color, gravity: 420,
    chunk: true, rot: Math.random() * 6, vr: randRange(-12, 12),
    floor: y + randRange(14, 30),     // 落到這個高度就停住
  });
}

// 飄起來的數字（同時最多 40 個，避免太亂、太耗效能）
function pushNum(x, y, text, color, size = 12) {
  if (!G) return;
  let n = 0;
  for (const e of G.effects) if (e.kind === 'num') n++;
  if (n >= 40) return;
  G.effects.push({ kind: 'num', x, y, text, color, size, t: 0.8, max: 0.8 });
}

function updateParticles(dt) {
  for (const p of G.particles) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.gravity * dt;
    if (p.chunk) {
      p.rot += p.vr * dt;
      if (p.y >= p.floor && p.vy > 0) { p.y = p.floor; p.vy = 0; p.vx = 0; p.vr = 0; p.gravity = 0; }
      continue;
    }
    p.vx *= 0.94;
    p.vy *= p.gravity ? 1 : 0.94;
  }
  G.particles = G.particles.filter(p => p.life > 0);
  G.shake *= 0.86;
  if (G.shake < 0.2) G.shake = 0;
}

// =====================================================
// 每一格畫面的更新
// =====================================================
function update(dt) {
  if (!G.started) return;

  // 特效倒數（遊戲結束後也繼續播，塔倒塌、勝負大字才播得完）
  for (const e of G.effects) e.t -= dt;
  G.effects = G.effects.filter(e => e.t > 0);
  if (G.over) return;

  // 開場倒數：倒數時不回聖水、不計時
  if (G.countdown > 0) {
    G.countdown -= dt;
    const n = Math.ceil(G.countdown);
    if (n < G.lastBeep && n > 0) { G.lastBeep = n; sfx('beep'); }
    if (G.countdown <= 0) {
      G.effects.push({ kind: 'banner', text: '開戰！', t: 0.9, max: 0.9 });
      sfx('go');
    }
    return;
  }

  // 聖水回復（上限 10）；超過上限的部分算「浪費」
  const raw = G.elixir + dt / ELIXIR_REGEN;
  G.elixir = Math.min(ELIXIR_MAX, raw);
  G.stats.wasted += raw - G.elixir;

  // 聖水滿 10 超過 2 秒 → 教練提醒（每次滿只提醒一次）
  if (G.elixir >= ELIXIR_MAX) {
    G.coach.fullTime += dt;
    if (G.coach.fullTime > 2 && !G.coach.fullWarned) {
      G.coach.fullWarned = true;
      coach('聖水滿了會浪費，趕快出牌');
    }
  } else {
    G.coach.fullTime = 0;
    G.coach.fullWarned = false;
  }

  // 倒數計時
  G.timeLeft -= dt;
  if (G.timeLeft <= 60 && !G.lastMinuteShown) {
    G.lastMinuteShown = true;
    G.effects.push({ kind: 'banner', text: '最後一分鐘', t: 1.4, max: 1.4 });
    sfx('beep');
  }
  if (G.timeLeft <= 0) {
    G.timeLeft = 0;
    judgeByTime();
    return;
  }

  expireCounters();
  updateAI(dt);
  for (const u of G.units) if (!u.dead) updateUnit(u, dt);
  for (const t of G.towers) updateTower(t, dt);

  // 移除死掉的單位（死掉時冒一團煙）
  // 陣亡：白煙＋隊伍色光圈＋💀 往上飄＋「噗」一聲（炸彈兵自爆有自己的特效）
  for (const u of G.units) {
    // 成就「完美防守」：敵方衝鋒豬或炸彈兵還沒打到塔就被解決
    if (u.dead && u.team === 'enemy' && (u.id === 'hog' || u.id === 'bomb') && !u.hitTower) award('perfect');
    if (!u.dead || u.card.bomb) continue;
    emit(u.x, u.y, 12, { color: '#ececec', speed: 45, life: 0.6, size: 5, up: 15 });
    if (u.card.building) continue;   // 砲塔時間到消失只冒煙
    emit(u.x, u.y, 6, { color: u.team === 'me' ? COLOR.meLight : COLOR.enemyLight, speed: 70, life: 0.4, size: 2.5 });
    G.effects.push({ kind: 'ring', x: u.x, y: u.y + 4, r0: 4, r1: 22, color: u.team === 'me' ? COLOR.me : COLOR.enemy, width: 2.5, t: 0.35, max: 0.35 });
    G.effects.push({ kind: 'icon', x: u.x, y: u.y - 10, text: '💀', t: 0.75, max: 0.75 });
    sfx('die');
  }
  G.units = G.units.filter(u => !u.dead);
}

// 更新 HTML 介面（聖水、時間、皇冠、手牌）
function updateUI() {
  // 聖水條：整數部分實心流動，正在充能的那一段半透明
  const whole = Math.floor(G.elixir);
  elixirFillEl.style.width = (whole / ELIXIR_MAX * 100) + '%';
  elixirChargeEl.style.width = (G.elixir / ELIXIR_MAX * 100) + '%';
  const full = G.elixir >= ELIXIR_MAX;
  elixirBarEl.classList.toggle('full', full);
  elixirGemEl.classList.toggle('full', full);
  // 聖水剛滿：「叮咚」一聲＋提示（每次滿只一次）
  if (full && !UI.wasFull && G.started && !G.over && G.countdown <= 0) {
    sfx('full');
    showMsg('💧 聖水滿了！', 1200, 'good');
  }
  UI.wasFull = full;
  if (elixirNumEl.textContent !== String(whole)) {
    elixirNumEl.textContent = whole;
    if (G.started) replayClass(elixirNumEl.parentElement, 'tick');
  }
  const s = Math.ceil(G.timeLeft);
  timerEl.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  timerEl.classList.toggle('hurry', s <= 60 && !G.over);
  timeLabelEl.textContent = s <= 60 ? '最後一分鐘' : '剩餘時間';
  const mk = killsBy('me');
  const ek = killsBy('enemy');
  // 皇冠變多時，新亮的那一個彈一下
  for (const [el, n] of [[myCrownsEl, mk], [enemyCrownsEl, ek]]) {
    if (el.dataset.n === String(n)) continue;
    const before = Number(el.dataset.n || 0);
    el.innerHTML = crownsHTML(n);
    if (n > before && el.dataset.n !== undefined) el.children[n - 1].classList.add('pop');
    el.dataset.n = n;
  }
  aiElixirEl.textContent = Math.floor(G.ai.elixir);
  updateHandState();
}

// =====================================================
// 繪圖：靜態背景（只畫一次，存在另一張畫布）
// =====================================================
const BG_SCALE = 3;   // 背景用 3 倍解析度畫，縮放後才清楚
const bgCanvas = document.createElement('canvas');
const vignetteCanvas = document.createElement('canvas');

// 固定種子的亂數（每次開都長一樣，裝飾不會亂跳）
function seeded(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 在指定畫布上畫圓角矩形路徑
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function buildBackground() {
  bgCanvas.width = W * BG_SCALE;
  bgCanvas.height = H * BG_SCALE;
  const c = bgCanvas.getContext('2d');
  c.scale(BG_SCALE, BG_SCALE);
  const rnd = seeded(20261016);
  const bankTop = RIVER_Y - RIVER_HALF - 6;      // 河岸沙地的範圍（只是畫面）
  const bankBot = RIVER_Y + RIVER_HALF + 6;

  // --- 草地：深淺兩色的方格（1 格 = 20 px，看得出距離），再加大片的明暗斑塊 ---
  for (let gy = 0; gy < H; gy += 20) {
    for (let gx = 0; gx < W; gx += 20) {
      c.fillStyle = ((gx + gy) / 20) % 2 ? '#5aab44' : '#63b54b';
      c.fillRect(gx, gy, 20, 20);
    }
  }
  for (let i = 0; i < 70; i++) {
    const x = rnd() * W, y = rnd() * H, r = 20 + rnd() * 50;
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rnd() < 0.5 ? 'rgba(20,70,15,0.10)' : 'rgba(200,255,150,0.07)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    c.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // 草葉紋理（很多小短線）
  for (let i = 0; i < 10000; i++) {
    const x = rnd() * W, y = rnd() * H;
    c.strokeStyle = rnd() < 0.5 ? 'rgba(25,75,18,0.2)' : 'rgba(180,240,130,0.16)';
    c.lineWidth = 0.6;
    c.beginPath();
    c.moveTo(x, y);
    c.lineTo(x + (rnd() - 0.5) * 1.5, y - 1.5 - rnd() * 2.2);
    c.stroke();
  }
  // 雙方半場淡淡的隊伍色（敵方上方偏紅、我方下方偏藍），幫助分辨
  let tg = c.createLinearGradient(0, 0, 0, RIVER_Y);
  tg.addColorStop(0, 'rgba(255,70,70,0.09)');
  tg.addColorStop(1, 'rgba(255,70,70,0)');
  c.fillStyle = tg;
  c.fillRect(0, 0, W, RIVER_Y);
  tg = c.createLinearGradient(0, RIVER_Y, 0, H);
  tg.addColorStop(0, 'rgba(70,140,255,0)');
  tg.addColorStop(1, 'rgba(70,140,255,0.10)');
  c.fillStyle = tg;
  c.fillRect(0, RIVER_Y, W, H - RIVER_Y);

  // --- 土路（兩條直路＋國王塔前的橫路）：深色邊、土色路面、中間較亮 ---
  const pathEdge = '#8a6738';
  function pathShape(x, y, w, h, r) { rr(c, x, y, w, h, r); }
  const paths = [];
  for (const lx of LANES) paths.push([lx - 15, ENEMY_KING_Y - 10, 30, MY_KING_Y - ENEMY_KING_Y + 20, 12]);
  paths.push([LANES[0], ENEMY_KING_Y - 10, LANES[1] - LANES[0], 20, 8]);
  paths.push([LANES[0], MY_KING_Y - 10, LANES[1] - LANES[0], 20, 8]);
  // 路邊的陰影和深色邊
  for (const [x, y, w, h, r] of paths) {
    pathShape(x - 2, y - 1, w + 4, h + 4, r + 2);
    c.fillStyle = 'rgba(0,0,0,0.18)';
    c.fill();
    pathShape(x - 1.5, y - 1.5, w + 3, h + 3, r + 1.5);
    c.fillStyle = pathEdge;
    c.fill();
  }
  for (const [x, y, w, h, r] of paths) {
    pathShape(x, y, w, h, r);
    c.fillStyle = '#c99f62';
    c.fill();
  }
  // 路面中間比較亮（被踩平的地方）
  for (const lx of LANES) {
    rr(c, lx - 8, ENEMY_KING_Y, 16, MY_KING_Y - ENEMY_KING_Y, 8);
    c.fillStyle = 'rgba(255,235,190,0.16)';
    c.fill();
  }
  // 小石子、車痕
  for (let i = 0; i < 900; i++) {
    const lx = LANES[i % 2];
    const x = lx + (rnd() - 0.5) * 26;
    const y = ENEMY_KING_Y + rnd() * (MY_KING_Y - ENEMY_KING_Y);
    c.fillStyle = rnd() < 0.5 ? 'rgba(115,80,38,0.38)' : 'rgba(255,240,205,0.38)';
    c.beginPath();
    c.ellipse(x, y, 0.6 + rnd() * 1.2, 0.5 + rnd(), 0, 0, Math.PI * 2);
    c.fill();
  }
  c.strokeStyle = 'rgba(110,75,35,0.22)';
  c.lineWidth = 1;
  for (const lx of LANES) {
    for (const off of [-6, 6]) {
      c.beginPath(); c.moveTo(lx + off, ENEMY_KING_Y); c.lineTo(lx + off, MY_KING_Y); c.stroke();
    }
  }
  // 路邊的石頭鑲邊
  for (const lx of LANES) {
    for (let y = ENEMY_KING_Y + 6; y < MY_KING_Y - 4; y += 7) {
      if (y > bankTop - 4 && y < bankBot + 4) continue;   // 河邊不畫
      for (const ex of [lx - 16, lx + 16]) {
        const r = 1.6 + rnd() * 1.1;
        c.fillStyle = 'rgba(0,0,0,0.2)';
        c.beginPath(); c.ellipse(ex + 0.5, y + 1, r, r * 0.7, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = rnd() < 0.5 ? '#bdb6a6' : '#a59e8f';
        c.beginPath(); c.ellipse(ex, y, r, r * 0.75, 0, 0, Math.PI * 2); c.fill();
      }
    }
  }

  // --- 塔的石頭地基（有斜面的石板） ---
  for (const t of makeTowers()) {
    const s = (t.type === 'king' ? 50 : 42) + 18;
    rr(c, t.x - s / 2 - 1, t.y - s / 2 + 4, s + 2, s, 10);
    c.fillStyle = 'rgba(0,0,0,0.28)';
    c.fill();
    rr(c, t.x - s / 2, t.y - s / 2, s, s, 9);
    const g = c.createLinearGradient(0, t.y - s / 2, 0, t.y + s / 2);
    g.addColorStop(0, '#d4cdbd');
    g.addColorStop(1, '#9e9686');
    c.fillStyle = g;
    c.fill();
    // 石板格線
    c.strokeStyle = 'rgba(60,50,35,0.16)';
    c.lineWidth = 0.8;
    for (let k = 1; k < 4; k++) {
      const ly = t.y - s / 2 + k * s / 4;
      c.beginPath(); c.moveTo(t.x - s / 2 + 3, ly); c.lineTo(t.x + s / 2 - 3, ly); c.stroke();
      const lx = t.x - s / 2 + k * s / 4 + (k % 2 ? 4 : -4);
      c.beginPath(); c.moveTo(lx, t.y - s / 2 + 3); c.lineTo(lx, t.y + s / 2 - 3); c.stroke();
    }
    // 上緣亮邊
    rr(c, t.x - s / 2 + 1, t.y - s / 2 + 1, s - 2, s - 2, 8);
    c.strokeStyle = 'rgba(255,255,255,0.35)';
    c.lineWidth = 1;
    c.stroke();
  }

  // --- 河岸（沙地＋小石子＋垂下來的草） ---
  const bank = c.createLinearGradient(0, bankTop, 0, bankBot);
  bank.addColorStop(0, '#d2bc82');
  bank.addColorStop(0.5, '#b89c5f');
  bank.addColorStop(1, '#cdb57a');
  c.fillStyle = bank;
  c.fillRect(0, bankTop, W, bankBot - bankTop);
  for (let i = 0; i < 160; i++) {
    const x = rnd() * W;
    const y = rnd() < 0.5 ? bankTop + 1 + rnd() * 4 : bankBot - 1 - rnd() * 4;
    c.fillStyle = rnd() < 0.5 ? 'rgba(120,100,70,0.5)' : 'rgba(240,228,190,0.6)';
    c.beginPath(); c.ellipse(x, y, 0.8 + rnd() * 1.3, 0.6 + rnd() * 0.8, 0, 0, Math.PI * 2); c.fill();
  }
  // 草地垂到沙地上的鋸齒邊
  for (let x = 0; x < W; x += 4) {
    c.fillStyle = '#4f9a3b';
    const h1 = 1.5 + rnd() * 2.5;
    const h2 = 1.5 + rnd() * 2.5;
    c.beginPath(); c.moveTo(x, bankTop); c.lineTo(x + 2, bankTop + h1); c.lineTo(x + 4, bankTop); c.fill();
    c.beginPath(); c.moveTo(x, bankBot); c.lineTo(x + 2, bankBot - h2); c.lineTo(x + 4, bankBot); c.fill();
  }

  // --- 裝飾：樹叢、石頭、草叢、小花（只放在兩側邊緣和角落，不擋路） ---
  function bush(x, y, r) {
    c.fillStyle = 'rgba(0,0,0,0.24)';
    c.beginPath(); c.ellipse(x + 2, y + r * 0.7, r * 1.2, r * 0.45, 0, 0, Math.PI * 2); c.fill();
    const blobs = [[0, 0, 1], [-0.6, 0.15, 0.7], [0.6, 0.15, 0.7], [0, -0.45, 0.65]];
    for (const [dx, dy, s] of blobs) {
      const g = c.createRadialGradient(x + dx * r - r * 0.2, y + dy * r - r * 0.3, 1, x + dx * r, y + dy * r, r * s);
      g.addColorStop(0, '#86d860');
      g.addColorStop(1, '#2c7426');
      c.fillStyle = g;
      c.beginPath(); c.arc(x + dx * r, y + dy * r, r * s, 0, Math.PI * 2); c.fill();
    }
  }
  function rock(x, y, r) {
    c.fillStyle = 'rgba(0,0,0,0.24)';
    c.beginPath(); c.ellipse(x + 1.5, y + r * 0.6, r, r * 0.4, 0, 0, Math.PI * 2); c.fill();
    const g = c.createLinearGradient(x, y - r, x, y + r);
    g.addColorStop(0, '#cdcac2');
    g.addColorStop(1, '#7a766e');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(x - r, y + r * 0.4);
    c.lineTo(x - r * 0.7, y - r * 0.5);
    c.lineTo(x + r * 0.1, y - r * 0.8);
    c.lineTo(x + r, y - r * 0.2);
    c.lineTo(x + r * 0.8, y + r * 0.5);
    c.closePath();
    c.fill();
  }
  function tuft(x, y) {
    c.strokeStyle = '#3f8a2e';
    c.lineWidth = 1;
    for (let k = -2; k <= 2; k++) {
      c.beginPath(); c.moveTo(x + k, y); c.quadraticCurveTo(x + k * 1.6, y - 3, x + k * 2.2, y - 5 - rnd() * 2); c.stroke();
    }
  }
  const decor = [
    ['bush', 14, 40, 9], ['bush', 346, 60, 10], ['rock', 22, 250, 5], ['bush', 340, 230, 8],
    ['bush', 16, 420, 9], ['rock', 344, 440, 6], ['bush', 344, 640, 10], ['bush', 18, 630, 8],
    ['rock', 30, 120, 4], ['rock', 330, 560, 4], ['bush', 130, 22, 7], ['bush', 232, 660, 7],
    ['rock', 236, 24, 4], ['rock', 128, 664, 4],
  ];
  for (const [kind, x, y, r] of decor) (kind === 'bush' ? bush : rock)(x, y, r);
  for (let i = 0; i < 40; i++) {
    const x = rnd() < 0.5 ? 4 + rnd() * 34 : W - 4 - rnd() * 34;
    const y = rnd() * H;
    if (y > bankTop - 8 && y < bankBot + 8) continue;
    tuft(x, y);
  }
  for (let i = 0; i < 80; i++) {
    const side = rnd() < 0.5 ? rnd() * 34 : W - rnd() * 34;
    const y = rnd() * H;
    if (Math.abs(y - RIVER_Y) < 22) continue;
    c.fillStyle = ['#fff6a0', '#ffffff', '#ffb3d1', '#c8b6ff'][Math.floor(rnd() * 4)];
    c.beginPath(); c.arc(side, y, 1 + rnd() * 0.8, 0, Math.PI * 2); c.fill();
  }

  // 暗角（四周稍暗，讓視線集中在中間）
  vignetteCanvas.width = W;
  vignetteCanvas.height = H;
  const v = vignetteCanvas.getContext('2d');
  const vg = v.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.36)');
  v.fillStyle = vg;
  v.fillRect(0, 0, W, H);
}

// 不能下牌區域的紅色斜線花紋
let stripePattern = null;
function getStripePattern() {
  if (stripePattern) return stripePattern;
  const p = document.createElement('canvas');
  p.width = 10; p.height = 10;
  const pc = p.getContext('2d');
  pc.fillStyle = 'rgba(220,40,40,0.18)';
  pc.fillRect(0, 0, 10, 10);
  pc.strokeStyle = 'rgba(255,80,80,0.32)';
  pc.lineWidth = 3;
  pc.beginPath(); pc.moveTo(-2, 12); pc.lineTo(12, -2); pc.stroke();
  stripePattern = ctx.createPattern(p, 'repeat');
  return stripePattern;
}

// =====================================================
// 繪圖：每一格
// =====================================================

// 畫有黑邊的文字
function outlinedText(text, x, y, size, color, stroke = 'rgba(0,0,0,0.85)') {
  ctx.font = `900 ${size}px "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(2.5, size / 5);
  ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

// 畫 emoji（置中）
// 注意：canvas 畫 emoji 會套用 fillStyle 的透明度，所以先設成不透明，不然會變半透明
function emoji(ch, x, y, size) {
  ctx.font = `${size}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';
  ctx.fillText(ch, x, y);
}

// 河水和橋（每格都畫，河水會流動）
function drawWater() {
  const top = RIVER_Y - RIVER_HALF;
  const bot = RIVER_Y + RIVER_HALF;
  const t = performance.now() / 1000;
  // 河水：兩岸淺、中間深
  const g = ctx.createLinearGradient(0, top, 0, bot);
  g.addColorStop(0, '#5cc6f5');
  g.addColorStop(0.35, '#2d93dc');
  g.addColorStop(0.65, '#1f78c8');
  g.addColorStop(1, '#3aa6ea');
  ctx.fillStyle = g;
  ctx.fillRect(0, top, W, RIVER_HALF * 2);
  // 岸邊下緣的陰影（看起來河比地面低）
  ctx.fillStyle = 'rgba(0,30,70,0.28)';
  ctx.fillRect(0, top, W, 2.5);
  // 流動的波紋（兩層速度不同）
  ctx.lineWidth = 1.1;
  for (let layer = 0; layer < 2; layer++) {
    ctx.strokeStyle = layer ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.4)';
    const speed = layer ? 11 : 20;
    for (let i = 0; i < 10; i++) {
      const x = ((i * 41 + layer * 19 + t * speed) % (W + 40)) - 20;
      const y = top + 5 + ((i + layer) % 3) * 6;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + 5, y - 2, x + 10, y);
      ctx.quadraticCurveTo(x + 15, y + 2, x + 20, y);
      ctx.stroke();
    }
  }
  // 水面閃光
  for (let i = 0; i < 6; i++) {
    const x = (i * 67 + 13) % W;
    const a = Math.max(0, Math.sin(t * 2.2 + i * 1.7));
    ctx.fillStyle = `rgba(255,255,255,${a * 0.7})`;
    ctx.fillRect(x, top + 6 + (i % 3) * 5, 2, 1.2);
  }
  // 岸邊的白色浪花
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let x = 0; x < W; x += 6) {
    const w = 1 + Math.sin(x * 0.7 + t * 3) * 0.8;
    ctx.fillRect(x, top + 2, 4, w);
    ctx.fillRect(x + 3, bot - w, 4, w);
  }
  // 橋：兩端石頭橋墩＋木板橋面＋繩子欄杆
  for (const lx of LANES) {
    const bx = lx - BRIDGE_HALF - 2;
    const by = top - 8;
    const bw = BRIDGE_HALF * 2 + 4;
    const bh = RIVER_HALF * 2 + 16;
    // 橋在水上的影子
    ctx.fillStyle = 'rgba(0,20,50,0.35)';
    ctx.fillRect(bx + 3, top, bw, RIVER_HALF * 2);
    // 木板
    ctx.fillStyle = '#7d4d27';
    ctx.fillRect(bx, by, bw, bh);
    for (let py = by + 1; py < by + bh - 1; py += 5) {
      ctx.fillStyle = (Math.round(py / 5) % 2) ? '#b07a45' : '#9a6535';
      ctx.fillRect(bx + 3, py, bw - 6, 4);
      ctx.fillStyle = 'rgba(255,230,190,0.18)';
      ctx.fillRect(bx + 3, py, bw - 6, 1);
      // 釘子
      ctx.fillStyle = 'rgba(40,25,10,0.6)';
      ctx.fillRect(bx + 5, py + 1.5, 1, 1);
      ctx.fillRect(bx + bw - 6, py + 1.5, 1, 1);
    }
    // 兩端的石頭橋墩
    for (const sy of [by - 3, by + bh - 4]) {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(bx - 2, sy + 2, bw + 4, 7);
      const sg = ctx.createLinearGradient(0, sy, 0, sy + 7);
      sg.addColorStop(0, '#d8d1c2');
      sg.addColorStop(1, '#948c7c');
      ctx.fillStyle = sg;
      rr(ctx, bx - 3, sy, bw + 6, 7, 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(60,50,35,0.3)';
      ctx.lineWidth = 0.7;
      for (let sx = bx + 4; sx < bx + bw; sx += 8) {
        ctx.beginPath(); ctx.moveTo(sx, sy + 1); ctx.lineTo(sx, sy + 6); ctx.stroke();
      }
    }
    // 欄杆柱子＋繩子
    ctx.fillStyle = '#4e2c12';
    for (const px of [bx - 1, bx + bw - 3]) {
      for (const py of [by + 2, by + bh / 2 - 2, by + bh - 7]) ctx.fillRect(px, py, 4, 5);
    }
    ctx.strokeStyle = '#e1c48d';
    ctx.lineWidth = 1.2;
    for (const px of [bx + 1, bx + bw - 1]) {
      ctx.beginPath();
      ctx.moveTo(px, by + 4);
      ctx.quadraticCurveTo(px, by + bh / 4 + 2, px, by + bh / 2);
      ctx.quadraticCurveTo(px, by + bh * 0.75 + 2, px, by + bh - 5);
      ctx.stroke();
    }
  }
}

// 選了牌時：不能下牌的區域蓋上紅色斜線（敵方公主塔倒掉的那一路前段除外）
function drawDeployZone() {
  if (G.selected === null || G.over || testModeEl.checked) return;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, RIVER_Y + RIVER_HALF);
  for (const p of pocketsOf('me')) ctx.rect(p.x1, p.y1, p.x2 - p.x1, p.y2 - p.y1);
  ctx.fillStyle = getStripePattern();
  ctx.fill('evenodd');
  ctx.restore();
  // 可以下牌的區域邊緣畫白色虛線
  ctx.save();
  ctx.setLineDash([7, 5]);
  ctx.lineDashOffset = -performance.now() / 40;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, RIVER_Y + RIVER_HALF + 1);
  ctx.lineTo(W, RIVER_Y + RIVER_HALF + 1);
  ctx.stroke();
  for (const p of pocketsOf('me')) ctx.strokeRect(p.x1 + 1, p.y1, p.x2 - p.x1 - 2, p.y2 - p.y1);
  ctx.restore();
}

// 下牌預覽：滑鼠移到競技場時，顯示單位會出現的位置
function drawDeployPreview() {
  if (G.selected === null || !G.hover || G.over) return;
  const c = CARDS[G.hand[G.selected]];
  const { x, y } = G.hover;
  const ok = canDeploy('me', x, y) || (testModeEl.checked && canDeploy('enemy', x, y));
  ctx.save();
  // 遠程單位、砲塔顯示射程圈
  if (c.range > MELEE) {
    ctx.fillStyle = ok ? 'rgba(255,255,255,0.08)' : 'rgba(255,60,60,0.08)';
    ctx.strokeStyle = ok ? 'rgba(255,255,255,0.6)' : 'rgba(255,80,80,0.6)';
    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, c.range, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.globalAlpha = 0.65;
  const offsets = c.count === 3 ? [-12, 0, 12] : [0];
  for (const off of offsets) {
    ctx.fillStyle = ok ? 'rgba(255,255,255,0.85)' : 'rgba(255,70,70,0.85)';
    ctx.beginPath();
    ctx.ellipse(x + off, y + 6, 11, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    emoji(c.emoji, x + off, y - 3, 17);
  }
  ctx.globalAlpha = 1;
  if (!ok) outlinedText('✕', x, y - 24, 18, '#ff5050');
  ctx.restore();
}

// 血條（中間可以寫數字）
function drawHpBar(x, y, w, h, ratio, color, label) {
  ctx.fillStyle = 'rgba(10,12,20,0.8)';
  rr(ctx, x - w / 2 - 1.5, y - 1.5, w + 3, h + 3, (h + 3) / 2);
  ctx.fill();
  if (ratio > 0) {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.25, color);
    g.addColorStop(1, color);
    ctx.fillStyle = g;
    rr(ctx, x - w / 2, y, Math.max(h, w * Math.min(1, ratio)), h, h / 2);
    ctx.fill();
  }
  if (label !== undefined) outlinedText(label, x, y + h / 2 + 0.5, h + 1, '#fff');
}

function drawTower(t) {
  const king = t.type === 'king';
  const s = king ? 50 : 42;
  const now = performance.now();
  if (!t.alive) {
    // 剛倒下的 0.45 秒：塔身往下塌陷、變扁、淡出，碎石慢慢出現
    const k = t.fellAt ? Math.min(1, (now - t.fellAt) / 450) : 1;
    if (k < 1) {
      const baseY = t.y + s / 2;
      ctx.save();
      ctx.globalAlpha = 1 - k;
      ctx.translate(t.x, baseY);
      ctx.scale(1 + k * 0.25, 1 - k * 0.85);
      ctx.translate(-t.x, -baseY);
      drawTowerBody(t, now, false);
      ctx.restore();
    }
    // 已摧毀：一堆碎石，偶爾冒煙
    ctx.save();
    ctx.globalAlpha = k;
    const stones = [[-11, 6, 9], [9, 8, 8], [0, -4, 10], [-7, -11, 6], [13, -6, 6], [4, 12, 5], [-15, -2, 4], [16, 5, 4]];
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(t.x + 3, t.y + 10, s / 2 + 2, 9, 0, 0, Math.PI * 2); ctx.fill();
    for (const [dx, dy, r] of stones) {
      const g = ctx.createLinearGradient(0, t.y + dy - r, 0, t.y + dy + r);
      g.addColorStop(0, '#a8a195');
      g.addColorStop(1, '#5d5850');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(t.x + dx, t.y + dy, r, 0, Math.PI * 2); ctx.fill();
    }
    // 倒下的隊伍色旗子
    ctx.fillStyle = t.team === 'me' ? COLOR.meDark : COLOR.enemyDark;
    ctx.fillRect(t.x + 6, t.y - 2, 10, 4);
    ctx.restore();
    if (G.started && Math.random() < 0.04) emit(t.x + randRange(-8, 8), t.y - 4, 1, { color: '#6e6a64', speed: 6, life: 1.4, size: 6, up: 14 });
    return;
  }
  // 被打到時塔本身抖一下
  let jx = 0, jy = 0;
  if (t.shakeUntil && now < t.shakeUntil) {
    const f = (t.shakeUntil - now) / 160;
    jx = randRange(-2, 2) * f;
    jy = randRange(-1, 1) * f;
  }
  ctx.save();
  ctx.translate(jx, jy);
  drawTowerBody(t, now, true);
  ctx.restore();
}

// 畫一座完整的塔（showBar：要不要畫血條）
function drawTowerBody(t, now, showBar) {
  const isMe = t.team === 'me';
  const king = t.type === 'king';
  const s = king ? 50 : 42;
  const h = s / 2;
  const main = isMe ? COLOR.me : COLOR.enemy;
  const dark = isMe ? COLOR.meDark : COLOR.enemyDark;
  const frontH = 12;        // 正面（立體感）的高度
  const top = t.y - h - 4;  // 塔頂面上緣

  // 陰影
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(t.x + 5, t.y + h + 2, h + 4, 7, 0, 0, Math.PI * 2); ctx.fill();
  // 正面（較暗的石牆）
  const fg = ctx.createLinearGradient(0, t.y + h - frontH, 0, t.y + h + 2);
  fg.addColorStop(0, '#a09989');
  fg.addColorStop(1, '#6b655b');
  ctx.fillStyle = fg;
  rr(ctx, t.x - h, t.y + h - frontH, s, frontH + 2, 4);
  ctx.fill();
  // 頂面（較亮的石板）
  const tg = ctx.createLinearGradient(0, top, 0, t.y + h - frontH);
  tg.addColorStop(0, '#f3eee2');
  tg.addColorStop(1, '#d0c8b8');
  ctx.fillStyle = tg;
  rr(ctx, t.x - h, top, s, s - frontH + 4, 5);
  ctx.fill();
  // 石磚縫
  ctx.strokeStyle = 'rgba(80,70,55,0.18)';
  ctx.lineWidth = 0.8;
  for (let ly = top + 14; ly < t.y + h - frontH; ly += 8) {
    ctx.beginPath(); ctx.moveTo(t.x - h + 3, ly); ctx.lineTo(t.x + h - 3, ly); ctx.stroke();
  }
  // 正面的石磚
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  for (let lx = t.x - h + 8; lx < t.x + h; lx += 9) {
    ctx.beginPath(); ctx.moveTo(lx, t.y + h - frontH + 1); ctx.lineTo(lx, t.y + h + 1); ctx.stroke();
  }
  // 血量變少時出現裂痕（60% 以下一條、30% 以下更多）
  const ratio = t.hp / t.maxHp;
  if (ratio < 0.6) {
    ctx.strokeStyle = 'rgba(50,40,30,0.65)';
    ctx.lineWidth = 1.1;
    const cracks = [[[-h + 4, top + 12], [-h + 10, top + 18], [-h + 7, top + 25], [-h + 13, t.y + h - 2]]];
    if (ratio < 0.3) {
      cracks.push([[h - 5, top + 10], [h - 11, top + 17], [h - 8, top + 23]]);
      cracks.push([[2, t.y + h - frontH], [5, t.y + h - 6], [1, t.y + h + 1]]);
    }
    for (const line of cracks) {
      ctx.beginPath();
      line.forEach(([dx, y], i) => (i ? ctx.lineTo(t.x + dx, y) : ctx.moveTo(t.x + dx, y)));
      ctx.stroke();
    }
  }
  // 城垛（隊伍顏色）
  ctx.fillStyle = dark;
  rr(ctx, t.x - h - 2, top - 1, s + 4, 11, 3);
  ctx.fill();
  ctx.fillStyle = main;
  rr(ctx, t.x - h - 2, top - 2, s + 4, 9, 3);
  ctx.fill();
  const n = king ? 5 : 4;
  const cw = (s + 4) / (n * 2 - 1);
  for (let i = 0; i < n; i++) {
    const cx = t.x - h - 2 + i * cw * 2;
    ctx.fillStyle = dark;
    ctx.fillRect(cx, top - 7, cw, 6);
    ctx.fillStyle = main;
    ctx.fillRect(cx, top - 8, cw, 5);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(cx, top - 8, cw, 1.2);
  }
  // 旗子（會飄）
  const px = t.x + h - 4;
  const py = top - 8;
  ctx.strokeStyle = '#3b2a18';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py - 16); ctx.stroke();
  const wave = Math.sin(now / 220 + t.x) * 2;
  ctx.fillStyle = main;
  ctx.beginPath();
  ctx.moveTo(px, py - 16);
  ctx.quadraticCurveTo(px + 6, py - 16 + wave, px + 12, py - 13);
  ctx.lineTo(px, py - 9);
  ctx.closePath();
  ctx.fill();
  // 塔上的人物
  emoji(king ? '🤴' : '👸', t.x, t.y + 1, king ? 23 : 19);
  // 被打到時閃白光
  if (now < t.flashUntil) {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    rr(ctx, t.x - h - 2, top - 8, s + 4, s + 12, 5);
    ctx.fill();
  }
  if (!showBar) return;
  // 血條（塔上方，中間寫數字）
  const barW = s + 12;
  const barY = top - (king ? 28 : 20);
  if (king) emoji('👑', t.x, barY - 9, 13);
  drawHpBar(t.x, barY, barW, 9, ratio, isMe ? COLOR.meBar : COLOR.enemyBar, Math.ceil(t.hp));
}

// 畫砲塔：石頭底座＋會轉向目標的砲管
function drawCannon(u) {
  const isMe = u.team === 'me';
  const age = performance.now() - u.born;
  const drop = age < 220 ? Math.pow(1 - age / 220, 2) * 40 : 0;
  const y = u.y - drop;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(u.x + 2, u.y + 10, 15, 5, 0, 0, Math.PI * 2); ctx.fill();
  // 木頭底座
  ctx.fillStyle = '#6b4a2b';
  rr(ctx, u.x - 14, y - 6, 28, 18, 4);
  ctx.fill();
  ctx.fillStyle = isMe ? COLOR.me : COLOR.enemy;
  ctx.fillRect(u.x - 14, y + 8, 28, 4);
  // 砲管（開砲時往後縮）
  const ang = u.aim !== undefined ? u.aim : (isMe ? -Math.PI / 2 : Math.PI / 2);
  const recoil = u.recoil && performance.now() - u.recoil < 120 ? 4 : 0;
  ctx.save();
  ctx.translate(u.x, y);
  ctx.rotate(ang);
  const bg = ctx.createLinearGradient(0, -5, 0, 5);
  bg.addColorStop(0, '#6a6a6a');
  bg.addColorStop(0.5, '#2c2c2c');
  bg.addColorStop(1, '#141414');
  ctx.fillStyle = bg;
  rr(ctx, -6 - recoil, -5, 22, 10, 4);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(16 - recoil, 0, 4, 0, Math.PI * 2); ctx.fill();
  // 開砲的火光
  if (recoil) {
    ctx.fillStyle = 'rgba(255,200,90,0.9)';
    ctx.beginPath(); ctx.arc(20, 0, 4.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#3a3a3a';
  ctx.beginPath(); ctx.arc(u.x, y, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.arc(u.x - 2, y - 2, 3, 0, Math.PI * 2); ctx.fill();
  if (performance.now() < u.flashUntil) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    rr(ctx, u.x - 15, y - 7, 30, 20, 5);
    ctx.fill();
  }
  // 血條一直顯示（會隨時間減少）
  drawHpBar(u.x, y - 20, 26, 4, u.hp / u.maxHp, isMe ? COLOR.meBar : COLOR.enemyBar);
}

// 受擊閃白用：把 emoji 做成一張純白剪影（第一次用到時畫好存起來）
const whiteCache = {};
function whiteEmoji(ch, size) {
  const key = ch + size;
  if (whiteCache[key]) return whiteCache[key];
  const S = 3;                       // 3 倍解析度，縮小後才清楚
  const box = Math.ceil(size * 1.5);
  const cv = document.createElement('canvas');
  cv.width = cv.height = box * S;
  const c = cv.getContext('2d');
  c.scale(S, S);
  c.font = `${size}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(ch, box / 2, box / 2);
  c.globalCompositeOperation = 'source-in';
  c.fillStyle = '#fff';
  c.fillRect(0, 0, box, box);
  whiteCache[key] = { cv, box };
  return whiteCache[key];
}

function drawUnit(u) {
  if (u.card.building) { drawCannon(u); return; }
  const isMe = u.team === 'me';
  const now = performance.now();

  // 判斷有沒有在走、面向哪邊（用上一格的位置比較）
  if (u.lx === undefined) { u.lx = u.x; u.ly = u.y; }
  const dx = u.x - u.lx;
  const moving = Math.hypot(dx, u.y - u.ly) > 0.02;
  if (Math.abs(dx) > 0.05) u.face = dx < 0 ? 1 : -1;   // emoji 大多面向左，往右走時翻過來
  u.lx = u.x; u.ly = u.y;

  // 下場時從空中落下
  const age = now - u.born;
  const drop = age < 220 ? Math.pow(1 - age / 220, 2) * 50 : 0;
  // 走路時上下晃
  const bob = moving ? Math.abs(Math.sin(now / 110 + u.x)) * 2.5 : 0;
  const lift = u.card.air ? 14 + Math.sin(now / 160 + u.x) * 2 : 0;
  const y = u.y - drop - bob - lift;
  const hurt = now < u.flashUntil;
  // 受擊時壓扁一下（落地那一刻也壓扁一下）
  const landing = age >= 220 && age < 320 ? 1 - (age - 220) / 100 : 0;
  const squash = hurt ? 0.18 * (u.flashUntil - now) / 120 : landing * 0.2;

  // 影子（越高越小越淡）
  const shadowScale = 1 - Math.min(0.5, (drop + lift) / 60);
  ctx.fillStyle = `rgba(0,0,0,${0.32 * shadowScale})`;
  ctx.beginPath(); ctx.ellipse(u.x, u.y + 7, 10 * shadowScale, 3.5 * shadowScale, 0, 0, Math.PI * 2); ctx.fill();

  // 隊伍底座（地上的圓環）
  if (!u.card.air) {
    ctx.strokeStyle = isMe ? COLOR.me : COLOR.enemy;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(u.x, u.y + 6, 10, 4, 0, 0, Math.PI * 2); ctx.stroke();
  }

  // 炸彈兵倒扣血時外圈閃紅黃光
  if (u.draining) {
    ctx.strokeStyle = (Math.floor(now / 110) % 2) ? '#ffea00' : '#ff3000';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(u.x, y - 2, 14, 0, Math.PI * 2); ctx.stroke();
  }

  // 本體：emoji（加一點陰影，翻轉面向；受擊時壓扁）
  const size = u.card.count === 3 ? 16 : 20;
  ctx.save();
  ctx.translate(u.x, y + 4);
  ctx.scale((u.face || 1) * (1 + squash), 1 - squash);
  ctx.translate(0, -7);
  ctx.shadowColor = isMe ? 'rgba(40,110,255,0.9)' : 'rgba(255,50,50,0.9)';
  ctx.shadowBlur = 4;
  emoji(u.card.emoji, 0, 0, size);
  // 受擊閃白：疊一張純白剪影
  if (hurt) {
    ctx.shadowBlur = 0;
    const wc = whiteEmoji(u.card.emoji, size);
    ctx.globalAlpha = 0.85 * (u.flashUntil - now) / 120;
    ctx.drawImage(wc.cv, -wc.box / 2, -wc.box / 2, wc.box, wc.box);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // 血條（受傷了才顯示）
  if (u.hp < u.maxHp) drawHpBar(u.x, y - 19, 22, 3.5, u.hp / u.maxHp, isMe ? COLOR.meBar : COLOR.enemyBar);
}

function drawEffects() {
  for (const e of G.effects) {
    const a = e.t / e.max;   // 1 → 0
    const p = 1 - a;         // 0 → 1（飛行進度）
    if (e.kind === 'arrow') {
      // 塔的箭：有箭頭的線，沿弧線飛向目標
      const x = e.x1 + (e.x2 - e.x1) * p;
      const y = e.y1 + (e.y2 - e.y1) * p - Math.sin(p * Math.PI) * 14;
      const ang = Math.atan2(e.y2 - e.y1 - Math.cos(p * Math.PI) * 14 * Math.PI, e.x2 - e.x1);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      ctx.strokeStyle = '#5a3a1a';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(3, 0); ctx.stroke();
      ctx.fillStyle = '#ddd';
      ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(1, -2.5); ctx.lineTo(1, 2.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(-10, -1.8, 3, 1.2);
      ctx.fillRect(-10, 0.6, 3, 1.2);
      ctx.restore();
    } else if (e.kind === 'ball') {
      // 砲彈
      const x = e.x1 + (e.x2 - e.x1) * p;
      const y = e.y1 + (e.y2 - e.y1) * p;
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill();
    } else if (e.kind === 'orb') {
      // 法師的火球（發光）
      const x = e.x1 + (e.x2 - e.x1) * p;
      const y = e.y1 + (e.y2 - e.y1) * p;
      const g = ctx.createRadialGradient(x, y, 0, x, y, 10);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.3, 'rgba(255,190,90,0.95)');
      g.addColorStop(1, 'rgba(255,90,30,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
    } else if (e.kind === 'heal') {
      // 治療綠線（跟著兩個單位的位置畫）
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = '#3dff7a';
      ctx.shadowColor = '#3dff7a';
      ctx.shadowBlur = 6;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(e.src.x, e.src.y - 4);
      ctx.lineTo(e.dst.x, e.dst.y - 4);
      ctx.stroke();
      ctx.restore();
    } else if (e.kind === 'splash') {
      // 法師的範圍傷害圈
      ctx.fillStyle = `rgba(255,140,40,${a * 0.3})`;
      ctx.strokeStyle = `rgba(255,200,120,${a})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(e.x, e.y, 30 * (0.6 + p * 0.4), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (e.kind === 'boom') {
      // 爆炸：外圈火光＋內圈白光
      const r = BOMB.radius * (0.5 + p * 0.8);
      const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
      g.addColorStop(0, `rgba(255,255,220,${a})`);
      g.addColorStop(0.4, `rgba(255,170,50,${a * 0.9})`);
      g.addColorStop(1, 'rgba(200,60,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.fill();
    } else if (e.kind === 'spawn') {
      // 下牌時的擴散圈
      ctx.strokeStyle = e.color;
      ctx.globalAlpha = a;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(e.x, e.y + 6, 8 + p * 26, (8 + p * 26) * 0.4, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (e.kind === 'ring') {
      // 衝擊波（下牌落地、單位陣亡、塔倒塌）：扁圓環往外擴散
      const r = e.r0 + (e.r1 - e.r0) * (1 - a * a);
      ctx.strokeStyle = e.color;
      ctx.globalAlpha = a;
      ctx.lineWidth = e.width * (0.4 + a * 0.6);
      ctx.beginPath(); ctx.ellipse(e.x, e.y, r, r * 0.5, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (e.kind === 'pillar') {
      // 下牌時的一道隊伍色光柱
      const g = ctx.createLinearGradient(0, e.y - 50, 0, e.y + 6);
      g.addColorStop(0, 'rgba(255,255,255,0)');
      g.addColorStop(1, e.color);
      ctx.globalAlpha = a * 0.55;
      ctx.fillStyle = g;
      const w = 14 * (0.5 + a * 0.5);
      ctx.fillRect(e.x - w / 2, e.y - 50, w, 56);
      ctx.globalAlpha = 1;
    } else if (e.kind === 'deny') {
      // 點到不能下的地方：紅色 ✕ 彈一下
      ctx.globalAlpha = a;
      outlinedText('✕', e.x, e.y - p * 6, 20 + (1 - a) * 6, '#ff5a5f');
      ctx.globalAlpha = 1;
    } else if (e.kind === 'counter') {
      // 剋制成功：金色大字彈出，下方小字寫誰剋誰
      const pop = Math.min(1, p * 6);
      const size = 20 * (0.6 + pop * 0.4) * (p < 0.17 ? 1.15 : 1);
      ctx.globalAlpha = Math.min(1, a * 2.5);
      const y = e.y - p * 14;
      outlinedText(e.text, e.x, y, size, '#ffd45a', '#5a3300');
      outlinedText(e.sub, e.x, y - 18, 11, '#ffffff');
      ctx.globalAlpha = 1;
    } else if (e.kind === 'icon') {
      // 往上飄的圖示（陣亡的 💀）
      ctx.globalAlpha = Math.min(1, a * 2);
      emoji(e.text, e.x, e.y - p * 18, 13 + Math.min(1, p * 5) * 3);
      ctx.globalAlpha = 1;
    } else if (e.kind === 'num') {
      // 飄起來的傷害數字：一開始放大再縮回，往上飄並淡出
      const size = e.size || 12;
      ctx.globalAlpha = Math.min(1, a * 2);
      outlinedText(e.text, e.x, e.y - p * 22, size + (1 - Math.min(1, p * 4)) * size * 0.4, e.color);
      ctx.globalAlpha = 1;
    }
  }
}

function drawParticles() {
  for (const p of G.particles) {
    if (p.chunk) {
      // 石塊碎片：會旋轉的方塊，最後 0.4 秒淡出
      ctx.globalAlpha = Math.min(1, p.life / 0.4);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.8);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(-p.size / 2, p.size * 0.15, p.size, p.size * 0.25);
      ctx.restore();
      continue;
    }
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * p.life / p.max), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// 畫面中央的大字（開場倒數、開戰、最後一分鐘、勝利／落敗）
function drawBanner() {
  let text = null;
  let scale = 1;
  let alpha = 1;
  let b = null;
  if (G.started && G.countdown > 0) {
    text = String(Math.ceil(G.countdown));
    const f = G.countdown % 1;
    scale = 1 + f * 0.5;
    alpha = Math.min(1, f * 3 + 0.2);
  } else {
    b = G.effects.find(e => e.kind === 'banner');
    if (b) { text = b.text; scale = 1 + Math.max(0, b.t / b.max - 0.7) * 1.2; alpha = Math.min(1, b.t / b.max * 3); }
  }
  // 遊戲結束：競技場變暗（落敗再加一點灰）
  if (G.over) {
    ctx.fillStyle = G.result === 'lose' ? 'rgba(20,24,34,0.45)' : 'rgba(10,12,24,0.3)';
    ctx.fillRect(0, 0, W, H);
  }
  if (!text) return;
  // 勝負的大字用不同顏色：勝利金、落敗灰、平手藍
  const palette = { win: ['#ffd45a', '#5a3300'], lose: ['#c9d0de', '#1d2230'], draw: ['#9cc2ff', '#13306b'] };
  const [fill, stroke] = (b && b.result) ? palette[b.result] : palette.win;
  ctx.save();
  ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(0, RIVER_Y - 40, 0, RIVER_Y + 40);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.5, 'rgba(0,0,0,0.5)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, RIVER_Y - 40, W, 80);
  const size = Math.round((text.length > 2 ? 34 : 50) * scale);
  outlinedText(text, W / 2, RIVER_Y + 2, size, fill, stroke);
  ctx.restore();
}

function draw() {
  ctx.save();
  // 畫面震動
  if (G.shake > 0) ctx.translate(randRange(-G.shake, G.shake), randRange(-G.shake, G.shake));
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  drawWater();
  drawDeployZone();
  // 塔和地面單位依 y 由上往下畫（下面的會蓋住上面的，有遠近感）
  const things = [];
  for (const t of G.towers) things.push({ y: t.y, draw: () => drawTower(t) });
  for (const u of G.units) if (!u.card.air) things.push({ y: u.y, draw: () => drawUnit(u) });
  things.sort((a, b) => a.y - b.y);
  for (const th of things) th.draw();
  // 空中單位最後畫（在最上層）
  for (const u of G.units) if (u.card.air) drawUnit(u);
  drawParticles();
  drawEffects();
  drawDeployPreview();
  ctx.restore();
  ctx.drawImage(vignetteCanvas, 0, 0, W, H);
  // 塔倒塌時整個畫面閃一下白光
  const flash = G.effects.find(e => e.kind === 'flash');
  if (flash) {
    ctx.fillStyle = `rgba(255,250,235,${(flash.t / flash.max) * 0.45})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawBanner();
}

// =====================================================
// 畫面縮放：競技場依視窗大小等比縮放
// =====================================================
function resize() {
  const app = document.getElementById('app');
  const wrap = document.getElementById('arenaWrap');
  let maxW, maxH;
  if (window.matchMedia('(min-width: 860px)').matches) {
    // 寬螢幕：競技場在左邊，用滿整個高度
    maxH = window.innerHeight - 34;
    maxW = window.innerWidth - 380 - 70;
  } else {
    // 直式：除了競技場以外，其他介面佔掉的高度
    const others = app.offsetHeight - wrap.offsetHeight + 10;
    maxW = app.clientWidth - 30;
    maxH = window.innerHeight - others;
  }
  const cssH = Math.max(260, Math.min(maxH, maxW * H / W));
  const cssW = cssH * W / H;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  // 依螢幕像素密度設定實際解析度，畫面才不會模糊
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  stripePattern = null;
}
window.addEventListener('resize', resize);
document.getElementById('testPanel').addEventListener('toggle', resize);

// 開始畫面的牌組預覽
function renderDeckPreview() {
  const box = document.getElementById('deckPreview');
  box.innerHTML = DECK.map(id => {
    const c = CARDS[id];
    return `<div class="mini role-${c.role}">${cardHTML(c)}<span class="gem"><b>${c.cost}</b></span></div>`;
  }).join('');
}

// =====================================================
// 主迴圈
// =====================================================
let lastTime = performance.now();
function loop(now) {
  // dt：距離上一格經過幾秒（最多算 0.05 秒，避免切分頁回來時暴衝）
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  updateParticles(dt);
  updateUI();
  draw();
  requestAnimationFrame(loop);
}

buildBackground();
renderDeckPreview();
newGame();
resize();
requestAnimationFrame(loop);
</script>
